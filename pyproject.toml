[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelone-mcp"
version = "0.1.0"
description = "FastMCP server for SentinelOne — KV-backed credentials"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "playwright>=1.61.0",
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    "requests>=2.32.0",
    "pyotp>=2.9.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
alerts = ["elasticsearch>=8.0.0"]

[project.scripts]
sentinelone-mcp = "sentinelone_mcp.server:main"

[tool.setuptools.packages.find]
include = ["sentinelone_mcp*", "helpers*"]
